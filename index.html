<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lobby Chat</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1c1a;--mute:#77756f;--line:#e4e2dc;--acc:#4f46e5;--accink:#fff;--me:#4f46e5;--meink:#fff;--them:#ecebe6}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--ink:#f1f0ec;--mute:#9a978f;--line:#2e2e2b;--acc:#8b85ff;--accink:#14141a;--me:#6d66f5;--them:#2a2a27}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
.screen{height:100%;display:none;flex-direction:column}
.screen.on{display:flex}
#home{align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:380px}
h1{margin:0 0 4px;font-size:28px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 22px;font-size:14px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus{border-color:var(--acc)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:var(--accink);font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;margin-top:10px}
.row input{flex:1;text-transform:uppercase;letter-spacing:4px;text-align:center;font-weight:600}
.or{text-align:center;color:var(--mute);font-size:13px;margin:16px 0 6px}
.err{color:#d6453d;font-size:13px;min-height:18px;margin-top:10px}
#top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
#code{font-weight:700;letter-spacing:4px;font-size:18px;cursor:pointer;border:1px dashed var(--line);border-radius:10px;padding:4px 10px}
#who{color:var(--mute);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top button{padding:8px 12px;font-size:14px}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--them);overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--me);color:var(--meink)}
.m small{display:block;font-size:11px;font-weight:700;opacity:.75;margin-bottom:2px}
.sys{align-self:center;color:var(--mute);font-size:12px;padding:2px 0}
#bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--card)}
#bar input{flex:1}
</style>
</head>
<body>
<div id="home" class="screen on">
  <div class="card">
    <h1>Lobby Chat</h1>
    <p class="sub">No sign-up. Pick a name, make a lobby, share the code.</p>
    <input id="name" maxlength="20" placeholder="Your username" autocomplete="off">
    <div class="row"><button id="create" style="flex:1">Create a lobby</button></div>
    <div class="or">or join one</div>
    <div class="row"><input id="join" maxlength="5" placeholder="ABCDE" autocomplete="off"><button id="go" class="ghost">Join</button></div>
    <div class="err" id="err"></div>
  </div>
</div>
<div id="chat" class="screen">
  <div id="top"><span id="code" title="Tap to copy"></span><span id="who"></span><button id="leave" class="ghost">Leave</button></div>
  <div id="msgs"></div>
  <div id="bar"><input id="text" maxlength="500" placeholder="Type a message…" autocomplete="off"><button id="send">Send</button></div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var ws=null,myId="",code="",inRoom=false;

function err(t){$("err").textContent=t||""}
function show(id){$("home").classList.toggle("on",id==="home");$("chat").classList.toggle("on",id==="chat")}
function line(cls,name,text){
  var d=document.createElement("div");d.className=cls;
  if(name){var s=document.createElement("small");s.textContent=name;d.appendChild(s)}
  d.appendChild(document.createTextNode(text));
  var b=$("msgs");var end=b.scrollHeight-b.scrollTop-b.clientHeight<80;
  b.appendChild(d);if(end||cls==="m me")b.scrollTop=b.scrollHeight;
}
function connect(first){
  err("");
  var proto=location.protocol==="https:"?"wss://":"ws://";
  ws=new WebSocket(proto+location.host);
  ws.onopen=function(){ws.send(JSON.stringify(first))};
  ws.onmessage=function(e){
    var m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.type==="error"){err(m.text);ws.close();return}
    if(m.type==="joined"){
